# Company Brain — nginx site config
#
#   sudo cp deploy/nginx/company-brain.conf /etc/nginx/sites-available/company-brain
#   sudo ln -s /etc/nginx/sites-available/company-brain /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS:
#   sudo certbot --nginx -d brain.example.com
#
# This file is HTTP-only on purpose. certbot rewrites it in place — it adds the
# 443 server block, the certificate paths and the 80->443 redirect. Writing a
# 443 block yourself before the certificate exists makes `nginx -t` fail, and
# certbot cannot then complete the challenge it needs port 80 for.
#
# Replace brain.example.com throughout. Paths assume the repo at
# /srv/company-brain and the API on 127.0.0.1:8787 (the systemd unit in
# DEPLOY.md §5 binds there deliberately, so only nginx can reach it).

server {
    listen 80;
    listen [::]:80;
    server_name brain.example.com;

    root /srv/company-brain/company-brain-app/dist;
    index index.html;

    access_log /var/log/nginx/company-brain.access.log;
    error_log  /var/log/nginx/company-brain.error.log;

    # Multi-file upload: api_integrations.py:119 takes list[UploadFile].
    # nginx's default is 1 MB, which fails the upload before FastAPI sees it.
    client_max_body_size 50M;

    # Vite ships minified but uncompressed. These are the types that matter;
    # PDFs and images are already compressed, so they are left out.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript
                      application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    # No CSP here: the app's inline-script surface has not been audited, and a
    # wrong CSP fails silently in a way that looks like a broken build.

    # ---------------------------------------------------------------- API
    # Same origin as the frontend. That is what keeps CORS_ORIGINS to a single
    # value and the session cookie same-site; the API sends credentials, so a
    # cross-origin setup here would mean widening CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Ingestion, rebuilds and Drive/SharePoint content proxying all run
        # long. The default 60s cuts them off mid-request as a 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;

        # api_google.py:321 and api_microsoft.py:447 stream file bodies back
        # through the API; give them room before nginx spills to disk.
        proxy_buffers     16 32k;
        proxy_buffer_size    32k;

        proxy_redirect off;
    }

    # ------------------------------------------------------- static assets
    # Filenames are content-hashed by Vite (index-BSmlhWOb.js), so a byte
    # change is a new URL. Immutable is safe and skips revalidation entirely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html names those hashed files, so it must never be cached — a stale
    # copy points at assets that no longer exist and the app loads blank.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # dist/data is 31 MB of the 32 MB build, copied from public/data. Nothing
    # fetches it at runtime any more (services/regIntel.ts reads the API now).
    # Served here so a stale reference cannot 404; delete public/data if you
    # want the deploy 30 MB smaller.
    location /data/ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\. { deny all; }        # .git, .env, editor droppings

    # ------------------------------------------------------------ the SPA
    # React Router owns the paths. Anything not matched above returns
    # index.html so a deep link or a refresh on /regulation/:id/impact works
    # instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
